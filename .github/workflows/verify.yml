name: Verify backend
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '24']
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: kheleo
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: kheleo_audit
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kheleo -d kheleo_audit"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://kheleo:ci-only-password@127.0.0.1:5432/kheleo_audit?schema=public
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm exec prisma validate
      - run: pnpm exec tsc --noEmit
      - name: Full test suite (Node 24 PostGIS WASM runtime)
        if: matrix.node == '24'
        run: pnpm test
      - run: pnpm build
      - name: Verify compiled exploit probes
        run: node audit-evidence/2026-11-05/probes.cjs
      - name: Verify both compiled entrypoints
        run: node scripts/verify-entrypoints.cjs
      - name: Apply migrations to native PostgreSQL/PostGIS
        run: pnpm exec prisma migrate deploy
      - name: Generate ephemeral production secrets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kheleo-keys"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/kheleo-keys/private.pem"
          openssl pkey -in "$RUNNER_TEMP/kheleo-keys/private.pem" -pubout -out "$RUNNER_TEMP/kheleo-keys/public.pem"
          chmod 600 "$RUNNER_TEMP/kheleo-keys/private.pem"
          {
            echo "NODE_ENV=production"
            echo "JWT_PRIVATE_KEY_PATH=$RUNNER_TEMP/kheleo-keys/private.pem"
            echo "JWT_PUBLIC_KEY_PATH=$RUNNER_TEMP/kheleo-keys/public.pem"
            echo "IDENTITY_PEPPER=$(openssl rand -hex 32)"
            echo "DRILL_HMAC_SECRET=$(openssl rand -hex 32)"
            echo "TELEMETRY_SERVICE_HMAC_SECRET=$(openssl rand -hex 32)"
            echo "CORS_ORIGINS=https://dashboard.example.test"
            echo "SUPABASE_URL=https://identity.example.test"
            echo "SUPABASE_PUBLISHABLE_KEY=synthetic-ci-only-key"
          } >> "$GITHUB_ENV"
      - name: Verify production start, HTTP, WebSockets, queues and measured GTI
        run: node scripts/smoke-production.cjs
      - name: Build production image
        run: docker build --build-arg NODE_IMAGE=node:${{ matrix.node }}-alpine -t kheleo-backend:verify .
      - name: Verify non-root container and healthcheck
        shell: bash
        run: |
          set -euo pipefail
          sudo chown -R 1000:1000 "$RUNNER_TEMP/kheleo-keys"
          trap 'docker logs kheleo-runtime; docker rm -f kheleo-runtime' EXIT
          docker run -d --name kheleo-runtime --network host \
            --env NODE_ENV=production --env PORT=3000 --env DATABASE_URL \
            --env REDIS_HOST --env REDIS_PORT --env CORS_ORIGINS \
            --env SUPABASE_URL --env SUPABASE_PUBLISHABLE_KEY \
            --env IDENTITY_PEPPER --env DRILL_HMAC_SECRET --env TELEMETRY_SERVICE_HMAC_SECRET \
            --env JWT_PRIVATE_KEY_PATH=/run/secrets/kheleo/private.pem \
            --env JWT_PUBLIC_KEY_PATH=/run/secrets/kheleo/public.pem \
            --mount type=bind,src="$RUNNER_TEMP/kheleo-keys",dst=/run/secrets/kheleo,readonly \
            kheleo-backend:verify
          for attempt in {1..90}; do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' kheleo-runtime)" = healthy ]; then break; fi
            sleep 1
          done
          test "$(docker exec kheleo-runtime id -u)" = 1000
          test "$(docker inspect --format '{{.State.Health.Status}}' kheleo-runtime)" = healthy
          curl --fail http://127.0.0.1:3000/api/v1/health
          curl --fail --output /dev/null http://127.0.0.1:3000/docs
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-verification-node-${{ matrix.node }}
          path: |
            audit-evidence/2026-11-05/probe-results.json
            audit-evidence/2026-11-05/route-inventory.json
            audit-evidence/2026-11-05/openapi.json
            audit-evidence/2026-11-05/ci-smoke-results.json
            audit-evidence/2026-11-05/ci-smoke-log.txt
            audit-evidence/2026-11-05/entrypoint-results.json
          retention-days: 14
